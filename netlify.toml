[build]
  command = "pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_ENABLE_MOCKS = "false"

[context.demo.environment]
  VITE_ENABLE_MOCKS = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
